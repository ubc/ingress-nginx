name: Controller Image (UBC)

# UBC-specific workflow: builds the ingress-nginx controller container images
# (standard + chroot) on `controller-v*` tag pushes and publishes them to
# GitHub Container Registry under `ghcr.io/ubc/ingress-nginx/`.
#
# Mirrors upstream's `make release` flow (see cloudbuild.yaml) which runs the
# Go cross-compile inside the golang build container, then uses buildx to
# assemble and push multi-arch images.
#
# The controller image is FROM the nginx base image. NGINX_BASE points at
# upstream's prebuilt base, which does NOT carry this fork's
# images/nginx/rootfs/patches/ stack (the nginx source CVE backports), so the
# base is compiled from source here and passed to `make release` as BASE_IMAGE.
# Each architecture's base is built on a native runner: compiling nginx and its
# modules for arm64 under QEMU took ~96 min, versus minutes natively.

on:
  push:
    tags:
      - 'controller-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag, branch, or SHA). Required.'
        required: true
        type: string
      tag:
        description: 'Image tag to publish (e.g. v1.15.5). Defaults to ref with controller- prefix stripped.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/ubc/ingress-nginx
  BUILDX_PLATFORMS: linux/amd64,linux/arm64
  PLATFORMS: amd64 arm64

jobs:
  resolve:
    name: Resolve ref and tags
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      base_tag: ${{ steps.base_tag.outputs.base_tag }}
    steps:
      - name: Resolve ref and image tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF='${{ inputs.ref }}'
            TAG='${{ inputs.tag }}'
            if [ -z "$TAG" ]; then
              TAG="${REF#controller-}"
            fi
          else
            REF="${GITHUB_REF_NAME}"
            TAG="${GITHUB_REF_NAME#controller-}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ref=${REF} as image tag=${TAG}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Read nginx base TAG
        id: base_tag
        run: echo "base_tag=$(cat images/nginx/TAG)" >> "$GITHUB_OUTPUT"

  # Build the patched nginx base once per architecture, each on a native runner,
  # and push it by digest. The base-manifest job joins the digests into one
  # multi-arch tag.
  base:
    name: nginx base (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as images/nginx/Makefile (`docker buildx build rootfs`), for a
      # single platform, pushed untagged so the manifest job can combine them.
      - name: Build and push patched nginx base (${{ matrix.platform }})
        id: build
        run: |
          docker buildx build images/nginx/rootfs \
            --platform "${{ matrix.platform }}" \
            --output "type=image,name=${REGISTRY}/nginx,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json
          DIGEST="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "Built ${{ matrix.platform }} base: ${REGISTRY}/nginx@${DIGEST}"

      # Fail the release if the base lacks the patch stack. `max_headers` is an
      # nginx directive that exists only with patch 37 (CVE-2026-49975): a
      # patched nginx prints "syntax is ok"; an unpatched one rejects it with
      # "unknown directive". Runs natively on each architecture, and requires the
      # positive result so that a container that fails to start also fails here.
      - name: Verify the base carries the patch stack (${{ matrix.platform }})
        run: |
          OUT="$(docker run --rm "${REGISTRY}/nginx@${{ steps.build.outputs.digest }}" \
            sh -c 'printf "events{}\nhttp{ max_headers 10; }\n" > /tmp/t.conf; nginx -c /tmp/t.conf -t 2>&1' || true)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q 'syntax is ok'; then
            echo "::error::nginx base image (${{ matrix.platform }}) is UNPATCHED or did not run: max_headers was not accepted."
            exit 1
          fi
          echo "Base image (${{ matrix.platform }}) carries the patch stack (max_headers recognized)."

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: base-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  base-manifest:
    name: nginx base (multi-arch manifest)
    needs: [resolve, base]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: base-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch base tag
        id: manifest
        env:
          BASE_TAG: ${{ needs.resolve.outputs.base_tag }}
        working-directory: /tmp/digests
        run: |
          BASE_REPO="${REGISTRY}/nginx"
          refs=()
          for d in *; do refs+=("${BASE_REPO}@sha256:${d}"); done
          [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 per-arch digests, got ${#refs[@]}"; exit 1; }
          docker buildx imagetools create -t "${BASE_REPO}:${BASE_TAG}" "${refs[@]}"
          DIGEST="$(docker buildx imagetools inspect "${BASE_REPO}:${BASE_TAG}" --format '{{.Manifest.Digest}}')"
          docker buildx imagetools inspect "${BASE_REPO}:${BASE_TAG}"
          echo "image=${BASE_REPO}:${BASE_TAG}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Built patched nginx base: ${BASE_REPO}:${BASE_TAG}@${DIGEST}"

  release:
    name: Build & Push
    needs: [resolve, base-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Override TAG file with image tag
        run: echo -n "${{ needs.resolve.outputs.tag }}" > TAG

      - name: Get Go version
        id: go
        run: echo "version=$(cat GOLANG_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true

      # The controller Dockerfile still has a few RUN steps for arm64; they are
      # cheap under QEMU (the Go binaries are cross-compiled natively).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller images
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ needs.resolve.outputs.tag }}
          BASE_IMAGE: ${{ needs.base-manifest.outputs.image }}
          BUILDX_PLATFORMS: ${{ env.BUILDX_PLATFORMS }}
          PLATFORMS: ${{ env.PLATFORMS }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          REPO_INFO: https://github.com/${{ github.repository }}
        run: make release

      - name: Summary
        run: |
          {
            echo "## Pushed images"
            echo ""
            echo '```'
            echo "${REGISTRY}/controller:${{ needs.resolve.outputs.tag }}"
            echo "${REGISTRY}/controller-chroot:${{ needs.resolve.outputs.tag }}"
            echo "base: ${{ needs.base-manifest.outputs.image }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
