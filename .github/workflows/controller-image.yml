name: Controller Image (UBC)

# UBC-specific workflow: builds the ingress-nginx controller container images
# (standard + chroot) on `controller-v*` tag pushes and publishes them to
# GitHub Container Registry under `ghcr.io/ubc/ingress-nginx/`.
#
# Mirrors upstream's `make release` flow (see cloudbuild.yaml) which runs the
# Go cross-compile inside the golang build container, then uses buildx to
# assemble and push multi-arch images.

on:
  push:
    tags:
      - 'controller-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag, branch, or SHA). Required.'
        required: true
        type: string
      tag:
        description: 'Image tag to publish (e.g. v1.15.5). Defaults to ref with controller- prefix stripped.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/ubc/ingress-nginx
  BUILDX_PLATFORMS: linux/amd64,linux/arm64
  PLATFORMS: amd64 arm64

jobs:
  release:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref and image tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF='${{ inputs.ref }}'
            TAG='${{ inputs.tag }}'
            if [ -z "$TAG" ]; then
              TAG="${REF#controller-}"
            fi
          else
            REF="${GITHUB_REF_NAME}"
            TAG="${GITHUB_REF_NAME#controller-}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ref=${REF} as image tag=${TAG}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Override TAG file with image tag
        run: echo -n "${{ steps.resolve.outputs.tag }}" > TAG

      - name: Get Go version
        id: go
        run: echo "version=$(cat GOLANG_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The controller image is FROM the nginx base image. NGINX_BASE points at
      # upstream's prebuilt base, which does NOT carry this fork's
      # images/nginx/rootfs/patches/ stack (the nginx source CVE backports). We
      # must build the base from source here and pass it to `make release` as
      # BASE_IMAGE, or the shipped controller runs unpatched nginx.
      - name: Build and push patched nginx base
        id: base
        env:
          # images/nginx/Makefile: IMAGE=$(REGISTRY)/nginx, TAG=$(cat TAG)
          REGISTRY: ${{ env.REGISTRY }}
          PLATFORMS: ${{ env.BUILDX_PLATFORMS }}
        run: |
          BASE_TAG="$(cat images/nginx/TAG)"
          make -C images/nginx push REGISTRY="${REGISTRY}" PLATFORMS="${PLATFORMS}"
          BASE_REPO="${REGISTRY}/nginx"
          DIGEST="$(docker buildx imagetools inspect "${BASE_REPO}:${BASE_TAG}" --format '{{.Manifest.Digest}}')"
          echo "image=${BASE_REPO}:${BASE_TAG}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Built patched nginx base: ${BASE_REPO}:${BASE_TAG}@${DIGEST}"

      # Fail the release if the base somehow lacks the patch stack. `max_headers`
      # is an nginx directive that exists only with patch 37 (CVE-2026-49975),
      # so an unpatched base rejects it with "unknown directive".
      - name: Verify the base carries the patch stack
        run: |
          OUT="$(docker run --rm --platform linux/amd64 "${{ steps.base.outputs.image }}" \
            sh -c 'printf "events{}\nhttp{ max_headers 10; }\n" > /tmp/t.conf; nginx -c /tmp/t.conf -t 2>&1' || true)"
          echo "$OUT"
          if echo "$OUT" | grep -q 'unknown directive "max_headers"'; then
            echo "::error::nginx base image is UNPATCHED (max_headers missing) — the patch stack did not build into it."
            exit 1
          fi
          echo "Base image carries the patch stack (max_headers recognized)."

      - name: Build and push controller images
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BASE_IMAGE: ${{ steps.base.outputs.image }}
          BUILDX_PLATFORMS: ${{ env.BUILDX_PLATFORMS }}
          PLATFORMS: ${{ env.PLATFORMS }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          REPO_INFO: https://github.com/${{ github.repository }}
        run: make release

      - name: Summary
        run: |
          {
            echo "## Pushed images"
            echo ""
            echo '```'
            echo "${REGISTRY}/controller:${{ steps.resolve.outputs.tag }}"
            echo "${REGISTRY}/controller-chroot:${{ steps.resolve.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
